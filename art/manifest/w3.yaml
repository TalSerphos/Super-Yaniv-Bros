# World 3 (DXB Airport) assets. Contract: docs/levels/w3-assets.md. Schema: tools/assets/README.md.
# Sprites are painted on flat magenta and keyed out; frames are built at 2x world units.
# Mood: a gleaming Dubai airport terminal. 3-1..3-3 in bright golden daylight (the style prefix asks for sunset,
# so those prompts override it); 3-4 Gate Closing is at sunset, like Tal's concept art (art/reference/w3-*.webp).
# Scale targets (2x px): Yaniv's idle is 107 tall; adults about the same.

- id: w3.bg.terminal
  kind: background
  refs: [art/reference/w3-security.webp, art/reference/w5-aisle.webp]
  size: 1536x1024
  candidates: 2
  frame: {w: 640, h: 360}
  seamless: x
  prompt: >
    Background layer for a side-scrolling platformer: the inside of a huge, gleaming modern airport terminal in
    Dubai, drawn as a flat, straight-on side view, perfectly level, no perspective, filling the whole image edge
    to edge. Use the first reference image for the setting and mood (its big windows, airplanes and warm
    light) and the second only for the pixel-art technique; ignore every character, sign, text, HUD and
    foreground object in them. Lighting: bright, warm golden DAYTIME sun, NOT sunset: a clear pale-blue sky with
    a few small white clouds. A tall wall of glass from near the top to the lower quarter, divided by slim white
    steel mullions every so often, under a white ceiling with gentle curved ribs and a row of small round
    downlights. Through the glass: a sunny apron with two or three parked white airliners at jet bridges, a
    control tower, small service vehicles, and far away on the hazy horizon a pale desert-city skyline of slim
    towers. The bottom fifth of the image is a far-away busy concourse: a polished cream marble floor with soft
    reflections and tiny distant silhouettes of travellers with roller bags. The pattern repeats evenly so it
    can tile horizontally. No signs, no screens with writing, no logos, no text, no letters, no numbers.
  out: {dir: w3, quality: 82, position: bottom}

- id: w3.bg.sunset
  kind: background
  refs: [art/reference/w3-gate.webp, art/reference/w5-aisle.webp]
  size: 1536x1024
  candidates: 2
  frame: {w: 640, h: 360}
  seamless: x
  prompt: >
    Background layer for a side-scrolling platformer: the departure-gate area of a huge, gleaming airport
    terminal in Dubai at SUNSET, drawn as a flat, straight-on side view, perfectly level, no perspective,
    filling the whole image edge to edge. Use the first reference image for the setting, colors and mood (the
    glowing orange-purple sunset sky, the airliners, the warm reflections) and the second only for the
    pixel-art technique; ignore every character, sign, text, HUD and foreground object in them. A tall wall of
    glass divided by slim dark steel mullions, a big low setting sun and purple-orange clouds outside, white
    airliners with their tails catching the light parked at jet bridges, a control tower on the left, runway
    lights starting to glow. Along the bottom fifth, far away inside: rows of empty dark-teal waiting seats and
    a polished floor reflecting the orange light. The pattern repeats evenly so it can tile horizontally. No
    signs, no screens with writing, no logos, no text, no letters, no numbers.
  out: {dir: w3, quality: 82, position: centre}  # keep the sunset sky (the seats sit low in the master)

