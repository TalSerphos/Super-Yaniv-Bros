  size: 1536x1024
  candidates: 2
  frame: {w: 64, h: 32}
  seamless: x
  prompt: >
    A flat, straight-on texture swatch that fills the entire image edge to edge, no perspective, no border, in
    the pixel style of the reference image (ignore its content and colors): the cut edge of a polished airport
    terminal floor used as the ground in a platformer, warm daylight. Along the top edge, a thin bright
    brushed-steel strip with a white highlight, about one twentieth of the image height. Directly below it,
    ONE course of big glossy cream-and-sand marble floor slabs seen from the edge, the course about one third
    of the image height, with thin dark joints about every quarter of the image width and soft warm
    reflections. Everything below that course, down to the bottom edge, is a plain smooth warm-grey stone face
    in soft shade with faint veining and NO joints. Even and horizontally tileable, no text.
  out: {dir: w3, colors: 48, position: top, span: 0.5}

