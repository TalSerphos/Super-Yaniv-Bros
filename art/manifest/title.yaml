# Stage 1 — title screen assets. See tools/assets/README.md for the schema.
# The first version (2026-10-03) recreated art/reference/title.webp without text. v2 (2026-10-05) inpainted Zvika's
# headphones (mask art/masks/title.bg.mask.png). v3 (2026-10-06): Captain Machchhar leans out of the cockpit side
# window and waves, inpainted around the plane's nose only. Base = art/masters/title.bg.webp as PNG; the repainted
# region is composited back onto the master with a feathered edge (HANDOVER, "Fixing one detail").
- id: title.bg
  kind: background
  refs: [art/masks/title.bg.base.png, art/masters/npc.captain.webp]
  mask: art/masks/title.bg.captain.mask.png
  size: 1536x1024
  candidates: 3
  prompt: >
    Edit only the masked area of this title-screen illustration, around the nose of the white airliner, and keep
    everything else pixel-identical: the four heroes standing on top of the plane stay exactly as they are. In
    the masked area, add Captain Machchhar, the plane's captain from the second image (use that image only for
    his look): grey hair, a grey moustache, a CLEARLY VISIBLE white gauze bandage wrapped around his forehead
    between his eyebrows and the peak of his dark captain's cap (gold badge), a white pilot shirt with black-and-gold four-stripe epaulettes and a black tie. He leans
    his head, shoulders and upper body OUT of the cockpit's side window, just behind the windshield, toward the
    viewer, and waves hello with one raised open hand, a big friendly open-mouthed grin on his face. The
    windshield in front of him keeps its original shape. Only his upper body is
    outside; his waist stays inside the window frame. He is smaller than the heroes standing on the roof (his
    head about two thirds the size of their heads) and he never covers them. Keep the fuselage, windshield,
    nose, landing gear and the sunset sky around him in the same 16-bit pixel-art style, same colours and light.
    No text, no letters, no logos.
  out: {width: 1280, height: 720, fit: cover, position: right, quality: 82}

- id: title.logo
  kind: ui
  refs: [art/reference/title.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  prompt: >
    Redraw only the game logo from this image as 16-bit pixel art, centered on a perfectly flat, solid,
    uniform magenta (#FF00FF) background with no gradient, no shadow on the background and no other objects.
    Line 1: chunky bevelled gold letters "SUPER". Line 2: big red-orange letters "YANIV BROS." with thick dark
    outlines. Under them a blue ribbon banner with forked ends reading "FLIGHT 1073" in cream letters.
    Spell exactly and only: SUPER / YANIV BROS. / FLIGHT 1073. No characters, no plane, no sky.
  out: {width: 900, trim: true, quality: 80}

- id: screen.coming-soon
  kind: screen
  refs: [art/reference/title.webp, art/reference/w5-aisle.webp]
  size: 1536x1024
  candidates: 2
  prompt: >
    Same pixel-art style and the same hero Yaniv (short dark hair, short beard, navy polo with wrench logo,
    brown tool belt, jeans, boots, red plunger). Inside an airplane cabin aisle at sunset, Yaniv stands next to a
    closed airplane lavatory door with a red "occupied" indicator light, shrugging with a friendly grin and holding
    his red plunger, a little "out of order" bucket and wet-floor cone beside him. Teal seats, cream walls, amber
    lights, purple-orange sunset in the round windows. Leave calm empty space in the upper third for a title.
    No text, no letters anywhere.
  out: {width: 1280, height: 720, fit: cover, position: centre, quality: 80}
