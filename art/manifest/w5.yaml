- id: w5.bg.wall
  kind: background
  refs: [art/reference/w5-aisle.webp]
  size: 1536x1024
  candidates: 2
  frame: {w: 640, h: 360}
  seamless: x
  prompt: >
    Background layer for a side-scrolling platformer: a long stretch of the far interior wall of an airliner
    cabin drawn as a flat, straight-on side view, perfectly level, NOT tilted, no perspective, seen from a
    distance so the details are small. Top fifth of the image: a row of closed cream overhead luggage bins with
    small dark latch handles, and a thin glowing warm amber light strip under them. Below that, cream wall panels
    with ONE horizontal row of about nine small, evenly spaced, rounded oval windows across the width; each window
    is only about a quarter of the image height and about two thirds as wide as it is tall, every window showing
    a purple-to-orange sunset over clouds. The bottom third of the image is plain cream wall panels getting
    darker toward the bottom. Same palette and pixel style as the reference image. The pattern repeats evenly so
    it can tile horizontally. No seats, no people, no luggage, no signs, no text.
  out: {dir: w5, quality: 85, position: top}

