  cells: [0, 1]
  frame: {w: 32, h: 32}
  fit: {mode: stretch}
  prompt: >
    Two square bonus blocks for a platformer, side by side, each a perfect square seen straight on, same size.
    They are flight-attendant call-button panels from an airliner ceiling: a chunky cream and light-grey plastic
