- id: enemy.binbiter
  kind: spritesheet
  refs: [art/masters/w5.tex.bin.webp, art/reference/w5-aisle.webp]
  size: 1024x1536
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 1, rows: 3}
  cells: [0, 1, 2]
  frame: {w: 48, h: 32}
  fit: {height: 64}
  anchor: bbox
  valign: top
  prompt: >
    Sprite sheet for a platformer enemy, the "Bin Biter": an airliner overhead luggage bin come to life, seen
    straight from the front like the bins in the reference images, cream and light-grey plastic, a wide box
    about twice as wide as it is tall. Its upper body has two angry glaring yellow eyes under heavy slanted
    dark brows. Its front door is its lower jaw, hinged along the bottom edge. No red anywhere.
    Layout: three equal rows stacked vertically (no grid lines), one bin per row, all at exactly the same size,
    their TOP edges level (the top of the bin never moves).
    (1) closed: the door shut, a jagged zig-zag seam of white teeth along the closed mouth line;
    (2) half open: the door-jaw dropped open a little, showing a dark charcoal interior and two rows of jagged
    white teeth on the upper and lower lips;
    (3) wide open: the door-jaw dropped wide open and hanging down below the box, a big dark gaping mouth with
    jagged white teeth, a small suitcase silhouette visible deep inside.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no gradient, no shadows on the background,
    no text, no labels.
  out: {dir: w5, colors: 48}

