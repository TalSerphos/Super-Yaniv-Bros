    Two sprites of the same airliner cockpit doorway for a platformer level goal, side by side, each drawn
    straight-on and not tilted, exactly twice as tall as it is wide, both exactly the same size with the same
    outer door frame, each tall and narrow (its height exactly twice its width). A heavy grey reinforced cockpit door in a thick cream bulkhead frame with rounded top
