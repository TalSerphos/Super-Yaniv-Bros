- id: npc.captain
  kind: spritesheet
  refs: [art/reference/w7-cockpit.webp, art/masters/yaniv.small.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 3, rows: 1}
  cells: [0, 1, 2]
  frame: {w: 48, h: 64}
  fit: {height: 108}
  prompt: >
    Sprite sheet for a heroic platformer NPC, "The Captain": the grey-haired airline captain on the left of
    the first reference image (the man in the white shirt being helped by the flight attendant), drawn as a
    full-body sprite with the SAME compact proportions, size and pixel style as the hero sprites in the second
    reference image (about 4 heads tall). Ignore the plumber's outfit; use the second image only for size and
    style. Exact outfit: a crisp white pilot shirt with black epaulettes that each have FOUR gold stripes, a
    black tie, a gold wings badge on the chest, dark charcoal trousers, black shoes, a dark captain's cap with a
    gold braid and gold badge on the peak. Short grey hair and a grey moustache. A clean white gauze bandage
    wrapped around his forehead, just below the cap. He is wounded but brave, dignified and kind: a respected
    hero, not a joke. Strict three-quarter side view facing RIGHT in every pose, standing on a common baseline.
    Layout: three equal columns in a row (no grid lines), one pose per column, same scale.
    (1) idle: standing tall and steady, chin up, determined smile, one hand resting on his side;
    (2) thumbs up: the same stance, his front arm raised giving a confident thumbs up to the right, a warm grin;
    (3) hurt: wincing with eyes shut, one hand pressed to his bandaged forehead, knees slightly bent, but still
    on his feet.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no gradient, no floor, no shadows on the
    background, no text, no labels.
  out: {dir: w5, colors: 64}

