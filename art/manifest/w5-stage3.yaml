# World 5, Stage 3 additions. Contract: docs/levels/w5-stage3-assets.md. Schema: tools/assets/README.md.
# Sprites are painted on flat magenta and keyed out; frames are built at 2x world units.
# Scale targets (2x px): Yaniv is 118 tall, items about his head (~28), suitcase knee-to-waist (~56),
# the Baby Bomber seat matches w5.seat (128), the Captain matches Yaniv.

- id: item.power
  kind: spritesheet
  size: 1024x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 2, rows: 2}
  cells: [0, 1, 2, 3]
  frame: {w: 16, h: 16}
  fit: {mode: each, height: 30}
  valign: middle
  prompt: >
    Four chunky power-up items for a platformer, in an invisible grid of 2 columns by 2 rows (no grid lines),
    each centered in its cell, the same size, bold and simple with thick dark outlines so they read at a tiny
    size, slightly from the front and above:
    (1) a round white ceramic bowl of hummus: a creamy beige swirl with a golden-green pool of olive oil in the
    middle, a few whole chickpeas, a pinch of orange paprika and a green parsley leaf;
    (2) a shiny solid-gold toilet plunger raised like a trophy and tilted diagonally: the wide gold rubber
    suction cup (a soft rounded half-dome, not a cone) at the TOP RIGHT with its open rim facing up and out, a
    straight gold handle running down to the
    lower left, bright white highlights, no knob, no floating sparkles; it must read as a plunger, not a bell;
    (3) a plain bright yellow crinkled foil snack bag, open at the top with a few puffy golden peanut-snack
    curls poking out; the bag has NO logo, NO letters, NO picture on it, just plain yellow foil with a white
    highlight;
    (4) a fluffy pita bread pocket seen from the side, stuffed and overflowing with fried purple-brown eggplant
    slices, sliced hard-boiled egg (white with yellow yolk), green and red chopped salad and a drizzle of tahini.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no shadows on the background, no text.
  out: {dir: w5, colors: 48}

- id: proj.plunger
  kind: spritesheet
  refs: [art/masters/item.power.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 3, rows: 1}
  cells: [0, 1, 2]
  frame: {w: 16, h: 16}
  fit: {mode: common, height: 32}
  valign: middle
  prompt: >
    Three sprites of the same small shiny solid-gold toilet plunger from the reference image (gold rubber cup,
    gold handle, thick dark outline), drawn as a thrown projectile flying to the RIGHT, in three equal columns
    (no grid lines), each centered in its column, the same plunger at the same size in all three:
    (1) flying horizontally, cup pointing RIGHT and handle trailing to the left, two short white speed lines
    attached behind the handle;
    (2) mid-spin, the plunger rotated diagonally, cup at the upper right, handle at the lower left;
    (3) stuck: horizontal, the cup on the RIGHT squashed flat against an invisible wall (flattened, wider
    rim), handle sticking straight out to the left, a tiny wobble line.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no shadows on the background, no text.
  out: {dir: w5, colors: 24}

- id: enemy.suitcase
  kind: spritesheet
  refs: [art/reference/w5-aisle.webp, art/masters/enemy.trolley.webp]
  size: 1024x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 2, rows: 2}
  cells: [0, 1, 2, 3]
  frame: {w: 32, h: 32}
  fit: {height: 50}
  prompt: >
    Sprite sheet for a platformer enemy, the "Suitcase Shell": a small grumpy hard-shell rolling suitcase come
    to life, like the purple suitcase in the first reference image, drawn in the same pixel style and with the
    same angry cartoon face style as the cart in the second reference image. Strict side view facing RIGHT.
    Glossy purple ribbed hard shell with teal corner guards and a teal zip line, the telescopic handle fully
    retracted (only a short stubby top grab handle), two small black wheels, a grumpy face on its side
    (heavy slanted brows, narrowed yellow eyes, a frowning mouth). No red, no brown, no navy.
    Layout: an invisible grid of 2 columns by 2 rows of equal cells (no grid lines), one suitcase per cell,
    centered, same scale, all on a common baseline in each row.
    (1) walking on two tiny stubby legs with little white sneakers, left leg forward; (2) walking, right leg
    forward, body bobbing up a little; (3) shell: the same suitcase shut tight with its legs tucked inside, eyes
    squeezed shut, sitting on its wheels; (4) spin: the same shut suitcase spinning fast, smeared with a few
    curved white motion-blur streaks and speed lines around it.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no gradient, no floor, no shadows on the
    background, no text, no labels.
  out: {dir: w5, colors: 48}

- id: enemy.baby
  kind: spritesheet
  refs: [art/masters/w5.seat.webp, art/reference/w5-aisle.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 3, rows: 1}
  cells: [0, 1, 2]
  frame: {w: 48, h: 64}
  fit: {height: 128}
  anchor: left
  prompt: >
    Sprite sheet for a platformer enemy, the "Baby Bomber": the SAME teal airliner economy seat as in the
    first reference image, at the same size and in the same strict side view facing RIGHT (seat back on the
    left, cushion pointing right, teal upholstery, cream-grey plastic shell and armrest, dark grey base).
    Sitting in it, facing right: a frazzled, exhausted but loving young parent (messy dark curly hair, tired
    eyes with dark circles, a mustard-yellow cardigan over a green t-shirt, grey jeans) holding a chubby
    crying baby on their lap. The baby wears a mint-green onesie, has a tiny tuft of hair, its face red-cheeked
    and bawling with tears flying, mouth wide open. Sympathetic and funny, not mocking.
    Layout: three equal columns in a row (no grid lines), one seat per column, the seat identical in all three
    and on a common floor baseline. Keep everything inside the seat's outline exactly like the passengers in
    the reference: the parent sits low and slumped with exhaustion, the top of the parent's head stays BELOW
    the top of the seat back, the parent's knees and feet stick out to the right no further than the
    passengers' in the reference, and the baby sits high on the parent's lap, its arms always staying close
    to its body, never reaching beyond the parent's knees. (1) idle: the baby bawling, the parent gently bouncing it with a weary
    smile; (2) wind-up: the baby leans back with one short arm raised just above its head, gripping a pastel
    pink pacifier, ready to throw; (3) throw: the baby's short arm flung forward to the right, hand open, NO
    pacifier anywhere in the picture (it is already gone), the parent wincing apologetically.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no gradient, no floor, no shadows on the
    background, no text, no labels.
  out: {dir: w5, colors: 64}

