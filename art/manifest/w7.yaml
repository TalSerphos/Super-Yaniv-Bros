# World 7 (The White House) assets. Contract: docs/levels/w7-assets.md. Schema: tools/assets/README.md.
# Sprites are painted on flat magenta and keyed out; frames are built at 2x world units.
# Mood: a bright morning in Washington. The style prefix asks for sunset light, so every prompt overrides it
# with clear morning daylight. Scale targets (2x px): Yaniv's idle is 107 tall, adults about the same or a bit
# more, the President about 1.12x Yaniv.

