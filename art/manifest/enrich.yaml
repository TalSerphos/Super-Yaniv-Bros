# Art enrichment pass (v0.8): more life and depth in the existing levels, with the Super Mario feel kept.
# Contract: docs/levels/enrich-assets.md. Schema: tools/assets/README.md.
# Every addition is a classic-platformer beat or SMW-era presentation: impact FX, the flagpole twin, themed
# "?" blocks, layered parallax, sparse background decor. The play layer must always read first, so decor is
# small, plain and painted to sit behind it. `from:` entries are cut from another entry's master (no extra call).

# --- FX: one paid sheet, five strips -------------------------------------------------------------------------
- id: fx.sheet
  kind: reference
  refs: [art/reference/w5-aisle.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  prompt: >
    A sprite sheet of tiny classic 16-bit platformer hit effects, in the crisp pixel style of the reference
    image (ignore its content). Bold, simple shapes with hard pixel edges and a thick dark outline where it
    helps; no soft glow, no blur, no gradients into the background. Layout: an invisible grid of 4 columns by 5
    rows of equal cells (do not draw grid lines), one effect frame centred in each cell, every frame small
    (about a third of its cell), each row one 4-frame animation read left to right:
    ROW 1, landing dust: a little cloud of round pale-beige dust puffs on a flat ground line, (1) two small
    puffs close together, (2) three bigger puffs spreading left and right, (3) the puffs wider apart and
    rounder, (4) the same puffs smaller and broken up, about to vanish. Puffs only, no ground drawn.
    ROW 2, stomp poof: (1) a small white starburst, (2) a bigger white and pale-yellow eight-pointed star with a
    few round white puffs around it, (3) a ring of four white puffs flying outward with tiny yellow stars, (4)
    four small puffs further out, breaking up.
    ROW 3, coin sparkle: (1) a tiny white four-pointed twinkle, (2) a bigger golden-white four-pointed sparkle
    star, (3) the biggest sparkle with four small dots around it, (4) a small fading cross of white dots.
    ROW 4, water splash: bright blue and white water, base on a flat line, (1) a low crown of droplets, (2) a
    tall column of water with drops flying up and out, (3) the column falling with droplets arcing down to both
    sides, (4) small droplets and a low ripple ring.
    ROW 5, four different broken shards of a cream and light-grey plastic panel with a dark outline, each a
    jagged small chunk tumbling at a different angle.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no shadows on the background, no text.

- id: fx.dust
  kind: spritesheet
  from: fx.sheet
  prompt: ''
  chroma: '#ff00ff'
  grid: {cols: 4, rows: 5}
  cells: [0, 1, 2, 3]
  frame: {w: 32, h: 16}
  fit: {mode: common, height: 18}
  out: {dir: w5, colors: 16}

- id: fx.poof
  kind: spritesheet
  from: fx.sheet
  prompt: ''
  chroma: '#ff00ff'
  grid: {cols: 4, rows: 5}
  cells: [4, 5, 6, 7]
  frame: {w: 32, h: 32}
  fit: {mode: common, height: 44}
  valign: middle
  out: {dir: w5, colors: 16}

- id: fx.sparkle
