# The world map (v0.9): an SMW-style overworld behind the level nodes. The nodes, the dotted path, Yaniv's marker
# and every label are DOM on top (boot.ts showMap), so the picture has no roads and no text. v1 put World 2 on a
# desert island; Tal: "the cockpit is in the desert?" World 2 is the cockpit, so v2 is one giant cutaway airliner:
# World 1 runs down the cabin aisle, World 2 is the cockpit in its nose, the airport and Washington are islands.
- id: map.bg
  kind: background
  refs: [art/masters/title.bg.webp, art/masters/w7.prop.whitehouse.webp]
  size: 1536x1024
  candidates: 2
  prompt: >
    A 16-bit pixel-art world map in the style of a classic Super Nintendo platformer overworld, in exactly the
    pixel technique of the reference images, bright and cheerful, chunky outlines, seen from directly above. A deep
    blue sea with small white wave ripples and a few small fluffy clouds fills the background. Three things:
    (1) LEFT: a fairly large sandy island, about a fifth of the image wide, in the lower-left part of the image,
    with a modern airport terminal with a curved glass roof, a control tower, palm trees and a wide open plaza.
    (2) CENTRE, the main subject: one GIANT, CHUBBY, cartoonishly wide white airliner seen from directly above,
    flying to the RIGHT, its body spanning from x 22% to x 76% of the image and its fuselage very wide (about a
    quarter of the image height), short wings reaching up and down, a red stripe on the tail. Its roof is cut away
    like a dollhouse so we look INSIDE: the passenger cabin with rows of teal seats on both sides of a wide
    central aisle with a red carpet runner, a galley; then a closed grey cockpit door across the fuselage; then, in
