# --- Yaniv: a skid (the classic turn-around brake) and the goal-pole slide -------------------------------------
# The third cell is a standing idle used only to calibrate the scale (measure.mts): fit.heights are that
# cell's scale applied to the two exported poses, so Yaniv stays exactly as tall as in yaniv.small (idle 107).
- id: yaniv.extra
  kind: spritesheet
  refs: [art/masters/char.yaniv.sheet.webp, art/masters/yaniv.small.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 3, rows: 1}
  cells: [0, 1]
  frame: {w: 64, h: 64}  # the skid is 1.22x as wide as tall: a 48-wide frame would shrink it
  fit: {heights: [99, 88]}  # idle cell 479 px -> 107: skid 441 px, pole 393 px at that scale
  prompt: >
    Sprite sheet for a classic 16-bit side-scrolling platformer. The SAME hero as in both reference images
    (Yaniv: short dark brown hair, short dark beard, NO hat, navy polo with a small white wrench logo, brown
    tool belt, blue jeans, brown boots, his red plunger), same proportions, same colors, and the same size as
    the sprites in the second reference image. Full-body side view, his face and chest turned to the RIGHT in
    every pose. Layout: three equal columns in a row (no grid lines), one pose per column, all at exactly the
    same scale, feet on a common baseline.
    (1) skid: braking hard from a run, the classic platformer turn-around: his face and chest turned to the
    RIGHT but his whole body leaning back to the LEFT, his right leg stretched far out to the right with the
    boot heel dug in, the left knee bent under him, both arms flung out for balance, the red plunger in his
    raised left hand, eyes wide, mouth open in a surprised "whoa"; compact: no wider than three quarters of his
    standing height;
    (2) pole slide: gripping a tall vertical pole that is NOT drawn, which stands just in front of him on his
    RIGHT side: both hands one above the other in front of his face, closed around the invisible upright bar,
    knees bent and pulled up, both boots pressed together against where the bar would be, a big happy grin; the
    red plunger hangs from his tool belt;
    (3) standing idle, relaxed, holding the red plunger, exactly like the first pose of the second reference
    image.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no gradient, no floor, no pole, no shadows on
    the background, no text, no labels, no grid lines.
  out: {dir: w5, colors: 64, despill: true}

