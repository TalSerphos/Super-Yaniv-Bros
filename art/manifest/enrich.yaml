# --- The flagpole twin: one pole per world, sign on / sign off ----------------------------------------------
- id: goal.pole
  kind: spritesheet
  refs: [art/reference/w5-aisle.webp, art/masters/block.call.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  grid: {cols: 6, rows: 1}
  cells: [0, 1, 2, 3, 4, 5]
  frame: {w: 32, h: 144}
  fit: {mode: common, height: 284}
  anchor: bbox
  prompt: >
    Six end-of-level goal poles for a classic 16-bit side-scrolling platformer, in the pixel style of the first
    reference image (ignore its content and its sunset light), chunky and toy-like like the block in the second
    reference. Six equal tall columns in a row (no grid lines), one pole per column, every pole exactly the same
    height, filling its column from near the top edge to the bottom edge, standing straight up, not tilted,
    seen straight on. Each is a slim shiny pole with a round ball on top and a chunky square base block at the
    bottom. Bold dark outlines so it reads at a small size.
    (1) and (2) the AIRLINER pole: a polished chrome pole, a square cream plastic base block with four corner
    screws; near the top a square airliner seatbelt-sign panel fixed to the pole showing a simple seatbelt
    pictogram (a seated stick figure with a belt) and no letters. (1) the sign lit bright amber and glowing;
    (2) the identical sign switched off, flat grey, the pictogram dim.
    (3) and (4) the AIRPORT pole: a brushed-steel pole, a navy-blue base block; near the top a square
    navy-blue boarding sign showing a simple white airplane pictogram and no letters. (3) the sign lit with a
    bright green glowing frame; (4) the identical sign switched off, dark, the airplane dim grey.
    (5) and (6) the FLAGPOLE: a white flagpole with a gold ball on top on a white marble base block, bright
    morning daylight. (5) a small United States flag (red and white stripes, a blue field of tiny white stars)
    hanging at the BOTTOM of the pole, just above the base; (6) the same flag raised to the TOP of the pole,
    flying out straight to the right in the breeze.
    In each pair everything except the sign or the flag is identical. Perfectly flat, solid, uniform magenta
    (#FF00FF) background, no ground, no shadows on the background, no text, no letters, no numbers.
  out: {dir: w5, colors: 48, despill: true}

