# World 6 (cockpit boss) assets. Contract: docs/levels/w6-boss-assets.md. Schema: tools/assets/README.md.
# Sprites are painted on flat magenta and keyed out; frames are built at 2x world units.
# Scale targets (2x px): Yaniv's idle is 107 tall (fit 118 is his median), Jacuzzam's idle about 1.65x that
# (~178, cap included), the Bros match Yaniv, items about his head (~28).

# Character bible: the master is used as the first reference for every Jacuzzam pose sheet. Not built.
- id: char.jacuzzam.sheet
  kind: reference
  refs: [art/reference/w6-cockpit.webp, art/masters/char.yaniv.sheet.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  prompt: >
    Character model sheet for the cartoon villain "Jacuzzam": the hulking man in the dark pilot uniform on the
    RIGHT of the first reference image (big pilot cap, black goggles, white gloves, reaching for the controls).
    Ignore everyone else in that image. Use the second reference image only for the model-sheet layout, the
    pixel style and the scale of a normal hero (do NOT draw the plumber): the villain is towering, more than
    one and a half times as tall as that plumber and twice as wide, about four and a half heads tall. Draw the villain four times in a row at exactly the same scale,
    all standing on one common baseline, full body from cap to shoes: (1) front view, (2) side profile facing
    LEFT, (3) back view, (4) three-quarter view facing LEFT. Hulking, top-heavy clown proportions: a huge barrel
    chest and broad shoulders, a round belly, short sturdy legs, big white-gloved hands, a big round chin.
    Exact outfit in every view: a dark blue-black navy pilot uniform jacket and trousers (much darker than
    navy blue, almost black) with three bright gold stripes on each sleeve cuff and gold buttons, black shoes;
    an OVERSIZED dark pilot cap with a gold braid on the peak and a small round gold rubber-duck badge on the
    front; big mirrored black aviator goggles with a shiny white glint that completely hide his eyes; a smug
    toothy grin, clean-shaven, no moustache, no beard; a fluffy white spa bathrobe worn as a cape over his
    shoulders, hanging down his back to his knees, tied at the neck with its white belt; white gloves; on BOTH
    wrist cuffs a chunky chrome jacuzzi-jet nozzle (a short shiny silver tube with a round spout). A silly,
    pompous cartoon clown, not scary. No weapon, no flags, no emblems other than the duck badge, no headdress.
    Perfectly flat, solid, uniform magenta (#FF00FF) background, no gradient, no floor, no shadows on the
    background, no text, no letters, no labels, no grid lines.

# The boss sheet is painted as two pose sheets (.a and .b, below) that share the bible as their first ref.
# Their chosen candidates are cut, brought to one common scale and composed into the 4x4 master of
# boss.jacuzzam (rows 1-2 = sheet a, rows 3-4 = sheet b), which is then `select`ed and built as one strip.
- id: boss.jacuzzam.a
  kind: reference
  refs: [art/masters/char.jacuzzam.sheet.webp, art/reference/w6-cockpit.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  prompt: >
    Sprite sheet for a platformer boss: the SAME villain as the character sheet in the first reference image
    (Jacuzzam: hulking, dark blue-black navy pilot uniform with three gold sleeve stripes, oversized dark pilot
    cap with a small gold rubber-duck badge, mirrored black aviator goggles hiding the eyes, smug toothy grin,
    clean-shaven, a fluffy white spa bathrobe worn as a cape, white gloves, a chrome jacuzzi-jet nozzle on each
    wrist cuff), same proportions, same colors, same size in every pose. Full-body side view facing LEFT in
    every pose (his face, chest and feet point to the left). The bathrobe cape hangs close behind his back and
    never flares wide. Layout: an invisible grid of 4 columns by 2 rows of equal cells (no grid lines). Each
    pose sits in the middle of its cell, fully inside it with a clear margin, all at exactly the same scale,
    feet on a common baseline in each row.
    Row 1: (1) idle: standing tall and smug, gloved fists on his hips, chest puffed out; (2) idle, the same pose
    with his chest and belly slightly lower as he breathes out; (3) throw: one arm raised high above his cap
    gripping a thick plain red ring binder (no letters on it), about to hurl it forward to the left, the other
    arm out for balance, leaning back; (4) jet wind-up: knees bent and braced, BOTH arms stretched straight
    forward to the left at chest height, the two wrist nozzles side by side, glowing bright aqua-blue.
    Row 2: (5) jet fire: recoiling backwards from the blast, leaning back, both arms still pointing forward to
    the left, a few small round soap bubbles just leaving the wrist nozzles (no long stream); (6) lean: bent
    forward at the waist, both gloved hands pressing down on something low in front of him at hip height (not
    drawn), grinning; (7) slap: one big arm swinging down and forward to the left in a wide arc with a few white
    swoosh lines, the other arm pulled back; (8) leave this last cell completely empty.
    Slapstick cartoon, no weapon, no blood. Perfectly flat, solid, uniform magenta (#FF00FF) background, no
    gradient, no floor, no shadows on the background, no text, no letters, no labels.

- id: boss.jacuzzam.b
  kind: reference
  refs: [art/masters/char.jacuzzam.sheet.webp, art/reference/w6-cockpit.webp]
  size: 1536x1024
  chroma: '#ff00ff'
  candidates: 2
  prompt: >
    Sprite sheet for a platformer boss being defeated: the SAME villain as the character sheet in the first
    reference image (Jacuzzam: hulking, dark blue-black navy pilot uniform with three gold sleeve stripes,
    oversized dark pilot cap with a small gold rubber-duck badge, mirrored black aviator goggles, clean-shaven,
    a fluffy white spa bathrobe worn as a cape, white gloves, a chrome jacuzzi-jet nozzle on each wrist cuff),
    same proportions, same colors, same size in every pose. Full-body side view facing LEFT in every pose. The
    bathrobe cape stays close to his body. Layout: an invisible grid of 4 columns by 2 rows of equal cells (no
    grid lines). Each pose sits in the middle of its cell, fully inside it with a clear margin, all at exactly
    the same scale, on a common baseline in each row.
    Row 1: (1) hit: knocked backwards, his goggles knocked sideways and hanging diagonally across his face so
    one round dazed cartoon eye peeks out, mouth open in an "ouch", a few soap bubbles popping around him; (2) stagger: dizzy and wobbling on his feet, his cap tilted sideways, a
    ring of small yellow stars and soap bubbles circling his head, tongue out; (3) held: standing upright, NOT walking,
    both elbows clamped tight against his sides and his forearms squeezed across his belly, as if invisible
    arms were wrapped around him from behind in a bear hug (that person is NOT drawn), struggling, shoulders
    hunched, one foot lifted and kicking, gritting his teeth; (4) tied: sitting on the floor with his
    legs stretched out in front of him to the left, his body wrapped round and round from chest to knees in
    tangled white headphone cables with a few small white earbuds dangling, arms trapped, sulking.
    Row 2: (5) tied and squirming: the same sitting tied pose leaning to the left, wriggling, a sweat drop;
    (6) tied and squirming: the same sitting tied pose leaning back to the right, wriggling, cap slipping;
    (7) and (8) leave these two cells completely empty.
    Slapstick cartoon, nobody is hurt, no weapon, no blood. Perfectly flat, solid, uniform magenta (#FF00FF)
    background, no gradient, no floor, no shadows on the background, no text, no letters, no labels.

