# Fallback asset generation in CI (the primary path is running the scripts locally in a
# Claude session). Needs the OPENAI_API_KEY repository secret.
name: Generate assets

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Manifest ids (comma list, prefix* or all)'
        required: true
      quality:
        description: low | medium | high
        default: low
      max_spend:
        description: Spend cap in USD for this run
        default: '5'
      promote:
        description: 'Promote candidate #0 of each id to master and open a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run assets:generate -- --ids "${{ inputs.ids }}" --quality "${{ inputs.quality }}" --max-spend "${{ inputs.max_spend }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: art/raw/
      - name: Promote and build
        if: inputs.promote
        run: |
          for dir in art/raw/*/${{ inputs.quality }}-*; do
            id=$(basename "$(dirname "$dir")")
            npm run -s assets:process -- select --id "$id" --from "$dir/0.png"
          done
          npm run -s assets:process -- build
      - uses: peter-evans/create-pull-request@v7
        if: inputs.promote
        with:
          branch: assets/${{ github.run_id }}
          title: 'Assets: ${{ inputs.ids }} (${{ inputs.quality }})'
          body: Generated by the assets workflow. Review the candidates artifact before merging.
          add-paths: |
            art/masters/
            src/assets/
            art/cost-log.csv
