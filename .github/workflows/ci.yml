name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # typecheck + vite build + size budgets
      - run: npx playwright install --with-deps
      - run: npm run e2e
      - name: Fidelity metrics (screenshot vs concept art)
        run: npm run fidelity
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.15.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            tests/fidelity/out/
            docs/fidelity/*.compare.webp
            .lighthouseci/
          retention-days: 14
